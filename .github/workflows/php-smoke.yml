name: PHP Smoke

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint PHP files
        run: |
          git ls-files '*.php' | xargs -n 1 php -l

      - name: Run security contract smoke tests
        run: php tests/smoke/security-contracts.php

      - name: Run workflow contract smoke tests
        run: php tests/smoke/workflow-contracts.php

      - name: Run performance contract smoke tests
        run: php tests/smoke/performance-contracts.php

      - name: Run tracking classification tests
        run: php tests/smoke/tracking-classification.php

      - name: Run bootstrap loading tests
        run: php tests/smoke/bootstrap-loading.php

  woocommerce-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        environment:
          - name: supported-floor
            wordpress: "7.0"
            woocommerce: "8.0.0"
            php: "8.0"
          - name: woocommerce-11.1
            wordpress: "7.0"
            woocommerce: "11.1.0"
            php: "8.0"
          - name: latest
            wordpress: latest
            woocommerce: latest
            php: "8.3"
        hpos:
          - "no"
          - "yes"

    name: WooCommerce (${{ matrix.environment.name }}, HPOS ${{ matrix.hpos }})

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.environment.php }}
          extensions: mysqli
          tools: wp-cli

      - name: Install WordPress and plugins
        env:
          WP_VERSION: ${{ matrix.environment.wordpress }}
          WC_VERSION: ${{ matrix.environment.woocommerce }}
        run: |
          WP_PATH="${RUNNER_TEMP}/wordpress"
          wp core download --path="$WP_PATH" --version="$WP_VERSION" --force
          wp config create --path="$WP_PATH" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          wp core install --path="$WP_PATH" --url=http://localhost --title="CK OWS Tests" --admin_user=admin --admin_password=password --admin_email=admin@example.com
          ln -s "$GITHUB_WORKSPACE" "$WP_PATH/wp-content/plugins/ck-order-workflow-suite"
          if [ "$WC_VERSION" = "latest" ]; then
            wp plugin install woocommerce --activate --path="$WP_PATH"
          else
            wp plugin install woocommerce --version="$WC_VERSION" --activate --path="$WP_PATH"
          fi
          wp plugin activate ck-order-workflow-suite --path="$WP_PATH"

      - name: Select order storage
        run: |
          WP_PATH="${RUNNER_TEMP}/wordpress"
          wp option update woocommerce_custom_orders_table_data_sync_enabled no --path="$WP_PATH"
          wp option update woocommerce_custom_orders_table_enabled ${{ matrix.hpos }} --path="$WP_PATH"

      - name: Run WooCommerce compatibility checks
        run: wp eval-file "$GITHUB_WORKSPACE/tests/integration/woocommerce-compatibility.php" --path="${RUNNER_TEMP}/wordpress"

      - name: Run uninstall compatibility checks
        run: wp eval-file "$GITHUB_WORKSPACE/tests/integration/uninstall-compatibility.php" --path="${RUNNER_TEMP}/wordpress"
