name: PHP Smoke

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint PHP files
        run: |
          git ls-files '*.php' | xargs -n 1 php -l

      - name: Run security contract smoke tests
        run: php tests/smoke/security-contracts.php

      - name: Run workflow contract smoke tests
        run: php tests/smoke/workflow-contracts.php

      - name: Run performance contract smoke tests
        run: php tests/smoke/performance-contracts.php

      - name: Run tracking classification tests
        run: php tests/smoke/tracking-classification.php

      - name: Run bootstrap loading tests
        run: php tests/smoke/bootstrap-loading.php

  woocommerce-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        environment:
          - name: supported-floor
            wordpress: https://wordpress.org/wordpress-7.0.zip
            woocommerce: https://downloads.wordpress.org/plugin/woocommerce.8.0.0.zip
            php: "8.0"
          - name: woocommerce-11.1
            wordpress: https://wordpress.org/wordpress-7.0.zip
            woocommerce: https://downloads.wordpress.org/plugin/woocommerce.11.1.0.zip
            php: "8.0"
          - name: latest
            wordpress: https://wordpress.org/latest.zip
            woocommerce: https://downloads.wordpress.org/plugin/woocommerce.zip
            php: "8.3"
        hpos:
          - "no"
          - "yes"

    name: WooCommerce (${{ matrix.environment.name }}, HPOS ${{ matrix.hpos }})

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install test tooling
        run: npm install --no-audit --no-fund

      - name: Configure test environment
        env:
          WP_CORE: ${{ matrix.environment.wordpress }}
          WC_PLUGIN: ${{ matrix.environment.woocommerce }}
          PHP_VERSION: ${{ matrix.environment.php }}
        run: node -e "require('fs').writeFileSync('.wp-env.override.json', JSON.stringify({core:process.env.WP_CORE,phpVersion:process.env.PHP_VERSION,plugins:['.',process.env.WC_PLUGIN]}, null, 2))"

      - name: Start WordPress
        run: |
          for attempt in 1 2 3; do
            if npx wp-env start; then
              exit 0
            fi

            npx wp-env stop || true
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          exit 1

      - name: Activate plugins and select order storage
        run: |
          npx wp-env run cli wp plugin activate --all
          npx wp-env run cli wp option update woocommerce_custom_orders_table_data_sync_enabled no
          npx wp-env run cli wp option update woocommerce_custom_orders_table_enabled ${{ matrix.hpos }}

      - name: Run WooCommerce compatibility checks
        run: npm run test:integration

      - name: Stop WordPress
        if: always()
        continue-on-error: true
        run: npx wp-env stop
